<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MESA PRO · Demo gastronómica</title><style>
:root{--bg:#f5f6f8;--ink:#17212d;--muted:#798391;--line:#e7e9ee;--primary:#e46b43;--dark:#172331;--green:#15966b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:238px;background:var(--dark);color:#fff;padding:24px 15px;overflow:auto}.brand{font-size:23px;font-weight:850;padding:0 12px 25px}.brand span{color:#ff936e}.nav{display:block;width:100%;padding:12px 13px;margin:3px 0;background:transparent;border:0;border-radius:10px;color:#afbdca;text-align:left}.nav:hover,.nav.active{background:#304050;color:#fff}.nav i{display:inline-block;width:25px;font-style:normal}.sidefoot{margin:30px 10px;color:#8999a9;font-size:12px}main{margin-left:238px;padding:25px 30px;max-width:1750px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.top h1{margin:0;font-size:25px}.muted{color:var(--muted)}.pill{background:#e9f8f1;color:#16805d;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.card .num{font-size:29px;font-weight:800;margin:10px 0 4px}.panel{margin-bottom:18px}.panel h3{margin:0 0 16px;font-size:16px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.btn{border:0;background:var(--primary);color:white;padding:10px 14px;border-radius:9px;font-weight:650}.btn.secondary{background:#eef0f4;color:#253344}.btn.dark{background:var(--dark)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:650}.tag{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750;background:#edf0f4;color:#536071}.tag.green{background:#e1f7ed;color:#128058}.tag.orange{background:#fff0df;color:#bc741f}.tag.red{background:#ffebeb;color:#c14b4b}.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.tablebox{border:1px solid #dfe4ea;border-radius:13px;padding:17px;background:#f8fafb;text-align:left;min-height:110px}.tablebox.free{border-color:#b9e7d0;background:#f0fbf5}.tablebox.busy{border-color:#f5d3a7;background:#fff8ed}.tablebox.reserved{border-color:#c8d1f7;background:#f2f5ff}.tablebox b{font-size:17px}.tablebox small{display:block;margin-top:8px;color:#657181}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:12px;padding:14px;background:white;text-align:left}.product:hover{border-color:var(--primary)}.product strong{display:block;margin:8px 0}.price{color:var(--primary);font-weight:800}.formrow{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:13px}input,select{border:1px solid #dce1e8;border-radius:9px;padding:10px;background:#fff;min-width:0}input{flex:1}.bar{height:9px;border-radius:10px;background:#edf0f3;overflow:hidden}.bar>span{display:block;height:100%;background:var(--primary)}.chart{height:190px;display:flex;align-items:end;gap:14px;border-bottom:1px solid var(--line);padding:12px 0}.chart .barcol{flex:1;background:linear-gradient(#ed9a76,#e46b43);border-radius:7px 7px 0 0;min-height:5px;position:relative}.barcol small{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;right:25px;bottom:25px;background:#182b37;color:white;padding:13px 20px;border-radius:10px;box-shadow:0 10px 30px #0002;display:none;z-index:10}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.statline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.menuToggle{display:none}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.split{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){aside{position:static;width:100%;padding:12px;max-height:74px;overflow:hidden;transition:max-height .2s}aside.open{max-height:650px}.brand{padding:4px 8px 12px}.menuToggle{display:inline-block;float:right;background:#314253;border:0;color:#fff;padding:7px 11px;border-radius:7px}main{margin:0;padding:18px}.top{align-items:start}.top h1{font-size:21px}.tables{grid-template-columns:repeat(2,1fr)}.cards{gap:8px}.card{padding:14px}.card .num{font-size:23px}.products{grid-template-columns:1fr}}
</style></head><body><aside id="sidebar"><button class="menuToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menú</button><div class="brand">MESA<span>PRO</span> <small style="font-size:10px;color:#9ba8b8">DEMO</small></div><div id="nav"></div><div class="sidefoot">● Restaurante Palermo<br>Demo interactiva · Sin backend</div></aside><main><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Restaurante Palermo · Gestión integral</div></div><span class="pill">● Local operativo</span></div><div id="view"></div></main><div id="toast" class="toast"></div><script>
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n),today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,9);
const seedProducts=[['Hamburguesa clásica','Principal',12500,42],['Pizza mozzarella','Principal',14500,28],['Milanesa napolitana','Principal',17800,31],['Papas fritas','Entrada',6500,75],['Ensalada César','Principal',10900,23],['Empanadas x3','Entrada',7200,48],['Gaseosa 500 ml','Bebida',3200,110],['Cerveza artesanal','Bebida',5900,65],['Flan casero','Postre',5400,20],['Tiramisú','Postre',6900,17]];
const initial={products:seedProducts.map((p,i)=>({id:i+1,name:p[0],category:p[1],price:p[2],stock:p[3]})),tables:Array.from({length:12},(_,i)=>({id:i+1,seats:i%3===0?6:4,status:i<4?'busy':i<6?'reserved':'free'})),orders:[{id:'1041',table:1,items:[{id:1,qty:2},{id:7,qty:2}],status:'Preparando',paid:false,time:'13:20'},{id:'1042',table:2,items:[{id:2,qty:1},{id:8,qty:2}],status:'Pendiente',paid:false,time:'13:32'},{id:'1043',table:3,items:[{id:3,qty:2},{id:4,qty:1}],status:'Listo',paid:false,time:'13:38'},{id:'1044',table:4,items:[{id:5,qty:2},{id:9,qty:2}],status:'Entregado',paid:false,time:'13:40'}],reservations:[{id:'r1',name:'Martina López',people:4,date:today(),time:'21:00',table:5,status:'Confirmada'},{id:'r2',name:'Juan Pérez',people:2,date:today(),time:'22:00',table:6,status:'Confirmada'}],expenses:[{id:'e1',name:'Proveedores',amount:68000,date:today()},{id:'e2',name:'Servicios',amount:24000,date:today()}],staff:[{id:1,name:'Sofía Martínez',role:'Encargada',shift:'Mañana'},{id:2,name:'Lucas Gómez',role:'Mozo',shift:'Noche'},{id:3,name:'Valentina Ruiz',role:'Cocina',shift:'Noche'}],sales:[{id:'v1',total:47500,date:today(),method:'Tarjeta'},{id:'v2',total:32100,date:today(),method:'Efectivo'},{id:'v3',total:59600,date:today(),method:'Transferencia'}]};
let state;try{state=JSON.parse(localStorage.getItem('mesapro_demo'))||structuredClone(initial)}catch{state=structuredClone(initial)}let page='Dashboard',cart=[],chosenTable=1;const save=()=>localStorage.setItem('mesapro_demo',JSON.stringify(state));const $=id=>document.getElementById(id);const toast=s=>{const e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};const total=o=>o.items.reduce((sum,i)=>sum+(state.products.find(p=>p.id===i.id)?.price||0)*i.qty,0);const pill=s=>`<span class="tag ${['Pagado','Listo','Entregado','Confirmada','Libre'].includes(s)?'green':['Pendiente','Preparando','Ocupada'].includes(s)?'orange':''}">${s}</span>`;const panel=(title,content)=>`<div class="panel"><h3>${title}</h3>${content}</div>`;const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Sin registros</td></tr>`}</tbody></table></div>`;const row=(...cells)=>`<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
const sections=[['▦','Dashboard'],['▤','Mesas'],['◉','Punto de venta'],['♨','Cocina'],['▣','Pedidos'],['◷','Reservas'],['☰','Carta y productos'],['▥','Inventario'],['♧','Personal'],['◈','Caja y gastos'],['▥','Reportes'],['⚙','Configuración']];function navigate(p){page=p;cart=[];render();$('sidebar').classList.remove('open')};function render(){ $('nav').innerHTML=sections.map(([ic,n])=>`<button class="nav ${page===n?'active':''}" onclick="navigate('${n}')"><i>${ic}</i>${n}</button>`).join('');$('title').textContent=page;let html='';switch(page){case'Dashboard':html=dashboard();break;case'Mesas':html=mesas();break;case'Punto de venta':html=pos();break;case'Cocina':html=cocina();break;case'Pedidos':html=pedidos();break;case'Reservas':html=reservas();break;case'Carta y productos':html=productos();break;case'Inventario':html=inventario();break;case'Personal':html=personal();break;case'Caja y gastos':html=caja();break;case'Reportes':html=reportes();break;case'Configuración':html=config()}$('view').innerHTML=html}
function dashboard(){let revenue=state.sales.reduce((a,b)=>a+b.total,0),open=state.orders.filter(o=>!o.paid).length;return `<div class="cards">${[['Ventas registradas',money(revenue),'↗ Movimientos demo'],['Pedidos activos',open,'En tiempo real (simulado)'],['Mesas ocupadas',state.tables.filter(t=>t.status==='busy').length,'De '+state.tables.length+' mesas'],['Reservas',state.reservations.length,'Reservas cargadas']].map(([l,n,s])=>`<div class="card"><div class="muted">${l}</div><div class="num">${n}</div><small class="muted">${s}</small></div>`).join('')}</div><div class="grid2">${panel('Ventas · últimos 7 días',`<div class="chart">${[34,51,42,69,58,83,74].map((v,i)=>`<div class="barcol" style="height:${v}%"><small>${['L','M','M','J','V','S','D'][i]}</small></div>`).join('')}</div><p class="muted" style="margin-top:35px">Gráfico ilustrativo con datos de muestra.</p>`)}${panel('Accesos rápidos',`<div class="actions"><button class="btn" onclick="navigate('Punto de venta')">+ Nuevo pedido</button><button class="btn secondary" onclick="navigate('Mesas')">Ver mesas</button><button class="btn secondary" onclick="navigate('Reservas')">Nueva reserva</button></div><div class="statline"><span>Órdenes en cocina</span><b>${state.orders.filter(o=>['Pendiente','Preparando'].includes(o.status)).length}</b></div><div class="statline"><span>Productos con stock bajo</span><b>${state.products.filter(p=>p.stock<25).length}</b></div><div class="statline"><span>Personal registrado</span><b>${state.staff.length}</b></div>`)}</div>${panel('Últimos pedidos',table(['Pedido','Mesa','Estado','Importe'],state.orders.slice(-5).reverse().map(o=>row('#'+o.id,'Mesa '+o.table,pill(o.status),money(total(o))))))}`}
function mesas(){return `<div class="actions"><button class="btn" onclick="navigate('Punto de venta')">+ Crear comanda</button><button class="btn secondary" onclick="addTable()">+ Agregar mesa</button></div>${panel('Plano de salón · tocá una mesa para cambiar su estado',`<div class="tables">${state.tables.map(t=>`<button class="tablebox ${t.status}" onclick="cycleTable(${t.id})"><b>Mesa ${t.id}</b><small>${t.seats} personas</small><small>${{free:'🟢 Libre',busy:'🟠 Ocupada',reserved:'🔵 Reservada'}[t.status]}</small></button>`).join('')}</div><p class="muted">Al tocar una mesa se alterna entre libre, ocupada y reservada.</p>`)}`};function cycleTable(id){let t=state.tables.find(t=>t.id===id);t.status={free:'busy',busy:'reserved',reserved:'free'}[t.status];save();render()}function addTable(){state.tables.push({id:Math.max(0,...state.tables.map(t=>t.id))+1,seats:4,status:'free'});save();render()}
function pos(){return `<div class="split">${panel('Seleccionar productos',`<div class="formrow"><select id="tableSelect" onchange="chosenTable=+this.value">${state.tables.map(t=>`<option value="${t.id}" ${chosenTable===t.id?'selected':''}>Mesa ${t.id}</option>`).join('')}</select><input placeholder="Buscar producto" oninput="filterProducts(this.value)"></div><div class="products" id="productList">${productButtons()}</div>`)}${panel('Comanda actual',`<div id="cartArea">${cartHTML()}</div><button class="btn" style="width:100%" onclick="submitOrder()">Enviar pedido a cocina</button>`)}</div>`};function productButtons(q=''){return state.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(p=>`<button class="product" onclick="addCart(${p.id})"><small class="muted">${p.category}</small><strong>${p.name}</strong><span class="price">${money(p.price)}</span><div class="muted" style="font-size:11px;margin-top:7px">Stock: ${p.stock}</div></button>`).join('')};function filterProducts(q){$('productList').innerHTML=productButtons(q)}function cartHTML(){return `${cart.length?cart.map(i=>{let p=state.products.find(p=>p.id===i.id);return `<div class="statline"><span>${p.name} × ${i.qty}</span><b>${money(p.price*i.qty)} <button class="btn secondary" onclick="removeCart(${i.id})">−</button></b></div>`}).join(''):'<div class="empty">Agregá productos para comenzar</div>'}<div class="statline"><b>Total</b><b>${money(cart.reduce((a,i)=>a+state.products.find(p=>p.id===i.id).price*i.qty,0))}</b></div>`};function addCart(id){let p=state.products.find(p=>p.id===id),i=cart.find(i=>i.id===id);if((i?.qty||0)>=p.stock)return toast('Stock insuficiente');i?i.qty++:cart.push({id,qty:1});$('cartArea').innerHTML=cartHTML()};function removeCart(id){let i=cart.find(i=>i.id===id);i.qty--;if(!i.qty)cart=cart.filter(x=>x.id!==id);$('cartArea').innerHTML=cartHTML()};function submitOrder(){if(!cart.length)return toast('Agregá al menos un producto');for(let i of cart)state.products.find(p=>p.id===i.id).stock-=i.qty;state.orders.push({id:String(Date.now()).slice(-6),table:chosenTable,items:structuredClone(cart),status:'Pendiente',paid:false,time:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})});state.tables.find(t=>t.id===chosenTable).status='busy';cart=[];save();toast('Pedido enviado a cocina');navigate('Cocina')}
function cocina(){return `<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">${['Pendiente','Preparando','Listo'].map(s=>`<div class="card"><div class="muted">${s}</div><div class="num">${state.orders.filter(o=>o.status===s).length}</div></div>`).join('')}</div><div class="products">${state.orders.filter(o=>['Pendiente','Preparando','Listo'].includes(o.status)).map(o=>`<div class="panel"><h3>#${o.id} · Mesa ${o.table}</h3><p>${pill(o.status)} · ${o.time}</p>${o.items.map(i=>`<div class="statline"><span>${state.products.find(p=>p.id===i.id)?.name||'Producto'} </span><b>×${i.qty}</b></div>`).join('')}<div class="actions" style="margin-top:15px">${o.status==='Pendiente'?`<button class="btn" onclick="setStatus('${o.id}','Preparando')">Preparar</button>`:o.status==='Preparando'?`<button class="btn" onclick="setStatus('${o.id}','Listo')">Marcar listo</button>`:`<button class="btn" onclick="setStatus('${o.id}','Entregado')">Entregar</button>`}</div></div>`).join('')||'<div class="empty">No hay comandas pendientes</div>'}</div>`};function setStatus(id,s){state.orders.find(o=>o.id===id).status=s;save();render();toast('Comanda actualizada')}
function pedidos(){return panel('Historial de comandas',table(['Pedido','Mesa','Hora','Estado','Total','Cobro'],state.orders.slice().reverse().map(o=>row('#'+o.id,'Mesa '+o.table,o.time,pill(o.status),money(total(o)),o.paid?pill('Pagado'):`<button class="btn" onclick="charge('${o.id}')">Cobrar</button>`))))};function charge(id){let o=state.orders.find(o=>o.id===id);if(o.paid)return;let method=prompt('Medio de pago: Efectivo, Tarjeta o Transferencia','Efectivo');if(method===null)return;o.paid=true;o.status='Entregado';state.sales.push({id:uid(),total:total(o),date:today(),method});let other=state.orders.some(x=>x.table===o.table&&!x.paid);if(!other)state.tables.find(t=>t.id===o.table).status='free';save();render();toast('Venta cobrada y registrada')}
function reservas(){return `${panel('Crear reserva',`<div class="formrow"><input id="rname" placeholder="Nombre del cliente"><input id="rpeople" type="number" min="1" value="2" placeholder="Personas"><input id="rdate" type="date" value="${today()}"><input id="rtime" type="time" value="21:00"><select id="rtable">${state.tables.map(t=>`<option value="${t.id}">Mesa ${t.id}</option>`).join('')}</select><button class="btn" onclick="addReservation()">Guardar reserva</button></div>`)}${panel('Próximas reservas',table(['Cliente','Personas','Fecha','Hora','Mesa','Estado','Acción'],state.reservations.map(r=>row(r.name,r.people,r.date,r.time,'Mesa '+r.table,pill(r.status),`<button class="btn secondary" onclick="cancelReservation('${r.id}')">Cancelar</button>`))))}`};function addReservation(){let name=$('rname').value.trim(),people=+$('rpeople').value,date=$('rdate').value,time=$('rtime').value,table=+$('rtable').value;if(!name||!date||!time||people<1)return toast('Completá los datos');if(state.reservations.some(r=>r.table===table&&r.date===date&&r.time===time))return toast('Esa mesa ya está reservada en ese horario');state.reservations.push({id:uid(),name,people,date,time,table,status:'Confirmada'});state.tables.find(t=>t.id===table).status='reserved';save();render();toast('Reserva creada')};function cancelReservation(id){let r=state.reservations.find(r=>r.id===id);state.reservations=state.reservations.filter(r=>r.id!==id);if(!state.orders.some(o=>o.table===r.table&&!o.paid)&&!state.reservations.some(x=>x.table===r.table))state.tables.find(t=>t.id===r.table).status='free';save();render()}
function productos(){return `${panel('Nuevo producto',`<div class="formrow"><input id="pname" placeholder="Nombre"><select id="pcat"><option>Principal</option><option>Entrada</option><option>Bebida</option><option>Postre</option></select><input id="pprice" type="number" placeholder="Precio ARS"><input id="pstock" type="number" placeholder="Stock"><button class="btn" onclick="addProduct()">+ Agregar</button></div>`)}${panel('Carta gastronómica',table(['Producto','Categoría','Precio','Stock','Acciones'],state.products.map(p=>row(p.name,p.category,money(p.price),p.stock,`<button class="btn secondary" onclick="editPrice(${p.id})">Editar precio</button> <button class="btn secondary" onclick="deleteProduct(${p.id})">Eliminar</button>`))))}`};function addProduct(){let name=$('pname').value.trim(),price=+$('pprice').value,stock=+$('pstock').value;if(!name||price<=0||stock<0)return toast('Datos inválidos');state.products.push({id:Math.max(0,...state.products.map(p=>p.id))+1,name,category:$('pcat').value,price,stock});save();render()};function editPrice(id){let p=state.products.find(p=>p.id===id),n=prompt('Nuevo precio para '+p.name,p.price);if(n===null||+n<=0)return;p.price=+n;save();render()};function deleteProduct(id){if(!confirm('¿Eliminar producto?'))return;state.products=state.products.filter(p=>p.id!==id);save();render()};function inventario(){return panel('Control de stock',table(['Producto','Categoría','Unidades','Nivel','Reponer'],state.products.map(p=>row(p.name,p.category,p.stock,pill(p.stock<25?'Bajo':'Disponible'),`<button class="btn secondary" onclick="restock(${p.id})">+ Stock</button>`))))};function restock(id){let p=state.products.find(p=>p.id===id),n=prompt('Unidades a ingresar',10);if(n===null||+n<=0)return;p.stock+=+n;save();render()};function personal(){return `${panel('Agregar empleado',`<div class="formrow"><input id="ename" placeholder="Nombre completo"><select id="erole"><option>Mozo</option><option>Cocina</option><option>Encargada</option><option>Cajero</option><option>Delivery</option></select><select id="eshift"><option>Mañana</option><option>Tarde</option><option>Noche</option></select><button class="btn" onclick="addStaff()">Agregar</button></div>`)}${panel('Equipo',table(['Nombre','Rol','Turno','Acción'],state.staff.map(e=>row(e.name,e.role,e.shift,`<button class="btn secondary" onclick="removeStaff(${e.id})">Quitar</button>`))))}`};function addStaff(){let name=$('ename').value.trim();if(!name)return;state.staff.push({id:Date.now(),name,role:$('erole').value,shift:$('eshift').value});save();render()};function removeStaff(id){state.staff=state.staff.filter(e=>e.id!==id);save();render()};function caja(){let income=state.sales.reduce((a,s)=>a+s.total,0),expenses=state.expenses.reduce((a,e)=>a+e.amount,0);return `<div class="cards" style="grid-template-columns:repeat(3,1fr)">${[['Ingresos',money(income)],['Gastos',money(expenses)],['Balance',money(income-expenses)]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="num">${b}</div></div>`).join('')}</div>${panel('Registrar gasto',`<div class="formrow"><input id="xname" placeholder="Concepto"><input id="xamount" type="number" placeholder="Importe"><button class="btn" onclick="addExpense()">Registrar gasto</button></div>`)}<div class="grid2">${panel('Movimientos de venta',table(['Fecha','Medio','Total'],state.sales.map(s=>row(s.date,s.method,money(s.total)))))}${panel('Egresos',table(['Fecha','Concepto','Importe'],state.expenses.map(e=>row(e.date,e.name,money(e.amount)))))}</div>`};function addExpense(){let name=$('xname').value.trim(),amount=+$('xamount').value;if(!name||amount<=0)return toast('Completá los datos');state.expenses.push({id:uid(),name,amount,date:today()});save();render()};function reportes(){let grouped={};state.sales.forEach(s=>grouped[s.method]=(grouped[s.method]||0)+s.total);let best=[...state.products].sort((a,b)=>b.stock-a.stock).slice(0,5);return `<div class="grid2">${panel('Ingresos por medio de pago',Object.entries(grouped).map(([k,v])=>`<div class="statline"><span>${k}</span><b>${money(v)}</b></div>`).join(''))}${panel('Indicadores',`<div class="statline"><span>Ventas registradas</span><b>${state.sales.length}</b></div><div class="statline"><span>Ticket promedio</span><b>${money(state.sales.reduce((a,b)=>a+b.total,0)/(state.sales.length||1))}</b></div><div class="statline"><span>Pedidos cobrados</span><b>${state.orders.filter(o=>o.paid).length}</b></div>`)}</div>${panel('Existencias destacadas',table(['Producto','Stock'],best.map(p=>row(p.name,p.stock))))}<p class="muted">Los indicadores usan los datos de demostración guardados en este navegador.</p>`};function config(){return panel('Configuración de la demo',`<p>Esta presentación funciona de forma local en el navegador. Los cambios se guardan en localStorage del dispositivo.</p><div class="actions"><button class="btn secondary" onclick="exportData()">Exportar datos JSON</button><button class="btn dark" onclick="resetDemo()">Restablecer datos de muestra</button></div><p class="muted">Para producción se requiere backend, autenticación, permisos, base de datos, facturación y pasarelas de pago reales.</p>`)};function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mesapro-demo.json';a.click();URL.revokeObjectURL(a.href)};function resetDemo(){if(!confirm('¿Restablecer toda la demo?'))return;state=structuredClone(initial);save();render()};render();
</script></body></html>
